<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" fill="none" width="900" height="560">
  <defs>
    <filter id="shadowDash" x="0" y="0" width="900" height="560" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="900" height="560" rx="14" fill="#FFFFFF"/>
  
  <!-- Browser Header Bar -->
  <rect width="900" height="42" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="21" r="5" fill="#10B981"/>
  
  <!-- Browser URL Bar -->
  <rect x="240" y="8" width="420" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1"/>
  <circle cx="258" cy="21" r="4" fill="#1264E8"/>
  <text x="272" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#475569">https://admin.busview.in/dashboard/live-fleet</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="42" width="200" height="518" fill="#101D35"/>
  
  <!-- Brand Logo inside sidebar -->
  <g transform="translate(18, 64)">
    <image href="/assets/busview-pin.png" x="0" y="0" width="24" height="24" preserveAspectRatio="xMidYMid meet" />
    <text x="32" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">BusView</text>
    <text x="32" y="30" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94A3B8">School Operations</text>
  </g>

  <!-- Nav Items -->
  <g transform="translate(14, 126)">
    <!-- Active Nav item: Live Map -->
    <rect x="0" y="0" width="172" height="38" rx="8" fill="#1E293B" stroke="#334155"/>
    <circle cx="18" cy="19" r="4" fill="#12CBA5"/>
    <text x="34" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Live Fleet Tracking</text>
    
    <!-- Item 2 -->
    <text x="34" y="65" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Buses &amp; Vehicles (18)</text>
    <!-- Item 3 -->
    <text x="34" y="105" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Assigned Drivers (18)</text>
    <!-- Item 4 -->
    <text x="34" y="145" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Student Roster (740)</text>
    <!-- Item 5 -->
    <text x="34" y="185" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Route Management</text>
    <!-- Item 6 -->
    <text x="34" y="225" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Trip History &amp; Logs</text>
    <!-- Item 7 -->
    <text x="34" y="265" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Settings</text>
  </g>

  <!-- School Institution Tag in Sidebar Bottom -->
  <g transform="translate(14, 490)">
    <rect width="172" height="48" rx="8" fill="#1E293B"/>
    <circle cx="24" cy="24" r="14" fill="#1264E8"/>
    <text x="19" y="29" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">HP</text>
    <text x="46" y="21" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Heritage Public</text>
    <text x="46" y="34" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94A3B8">Session 2026-27</text>
  </g>

  <!-- Main Content Area -->
  <!-- Top Bar -->
  <g transform="translate(224, 60)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#101D35">Fleet Operations Control Center</text>
    <text x="0" y="38" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Live telematics, route compliance, and active driver locations</text>
    
    <!-- Status Pills -->
    <g transform="translate(430, 2)">
      <rect x="0" y="0" width="108" height="32" rx="16" fill="#EFF5FF" stroke="#BFDBFE"/>
      <circle cx="16" cy="16" r="4" fill="#1264E8"/>
      <text x="26" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1264E8">18 Active Buses</text>

      <rect x="118" y="0" width="108" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0"/>
      <circle cx="134" cy="16" r="4" fill="#10B981"/>
      <text x="144" y="20" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#047857">0 Delays</text>
    </g>
  </g>

  <!-- Fleet Metrics Cards -->
  <g transform="translate(224, 114)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="150" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="14" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">Fleet On-Road</text>
    <text x="14" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#101D35">18 / 18</text>

    <!-- Metric 2 -->
    <rect x="166" y="0" width="150" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="180" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">Morning Run Progress</text>
    <text x="180" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#1264E8">74%</text>

    <!-- Metric 3 -->
    <rect x="332" y="0" width="150" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="346" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">Students Tracked</text>
    <text x="346" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#101D35">740</text>

    <!-- Metric 4 -->
    <rect x="498" y="0" width="156" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="512" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#64748B">Parent Inquiries Saved</text>
    <text x="512" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#12CBA5">~140 / hr</text>
  </g>

  <!-- Live Multi-Bus Map & Active List Container -->
  <g transform="translate(224, 194)">
    <!-- Map Canvas (Left 410px) -->
    <rect x="0" y="0" width="410" height="340" rx="10" fill="#E2E8F0" stroke="#CBD5E1"/>
    
    <!-- City grid lines -->
    <path d="M 0 80 L 410 80" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 0 180 L 410 180" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 0 270 L 410 270" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 100 0 L 100 340" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 230 0 L 230 340" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M 340 0 L 340 340" stroke="#FFFFFF" stroke-width="6"/>

    <!-- School Pin -->
    <circle cx="230" cy="180" r="16" fill="#101D35"/>
    <text x="218" y="184" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">SCH</text>

    <!-- Bus 01 Pin -->
    <g transform="translate(100, 70)">
      <circle cx="10" cy="10" r="12" fill="#1264E8" stroke="#FFFFFF" stroke-width="2"/>
      <text x="4" y="14" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF">B1</text>
    </g>

    <!-- Bus 04 Pin (Highlighted) -->
    <g transform="translate(290, 80)">
      <circle cx="14" cy="14" r="16" fill="#12CBA5" opacity="0.3"/>
      <circle cx="14" cy="14" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
      <text x="8" y="18" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#101D35">B4</text>
      <!-- Mini Callout -->
      <rect x="-35" y="-22" width="98" height="18" rx="4" fill="#101D35"/>
      <text x="-28" y="-10" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#FFFFFF">Bus 04: On Schedule</text>
    </g>

    <!-- Bus 08 Pin -->
    <g transform="translate(140, 240)">
      <circle cx="10" cy="10" r="12" fill="#1264E8" stroke="#FFFFFF" stroke-width="2"/>
      <text x="4" y="14" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#FFFFFF">B8</text>
    </g>

    <!-- Bus 12 Pin -->
    <g transform="translate(320, 250)">
      <circle cx="10" cy="10" r="12" fill="#1264E8" stroke="#FFFFFF" stroke-width="2"/>
      <text x="3" y="14" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#FFFFFF">B12</text>
    </g>

    <!-- Active Buses Roster Table (Right 234px) -->
    <rect x="424" y="0" width="230" height="340" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="438" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#101D35">Active Routes Roster</text>
    
    <!-- Table Item 1 -->
    <g transform="translate(436, 40)">
      <rect width="206" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#101D35">Bus #04 • Route 4A</text>
      <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Driver: Ramesh K. • 32 km/h</text>
      <rect x="148" y="10" width="48" height="16" rx="8" fill="#ECFDF5"/>
      <text x="154" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#047857">ON ROUTE</text>
    </g>

    <!-- Table Item 2 -->
    <g transform="translate(436, 102)">
      <rect width="206" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#101D35">Bus #08 • Route 2C</text>
      <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Driver: Mohan S. • 28 km/h</text>
      <rect x="148" y="10" width="48" height="16" rx="8" fill="#ECFDF5"/>
      <text x="154" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#047857">ON ROUTE</text>
    </g>

    <!-- Table Item 3 -->
    <g transform="translate(436, 164)">
      <rect width="206" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#101D35">Bus #12 • Route 7B</text>
      <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Driver: Anil Verma • 34 km/h</text>
      <rect x="148" y="10" width="48" height="16" rx="8" fill="#ECFDF5"/>
      <text x="154" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#047857">ON ROUTE</text>
    </g>

    <!-- Table Item 4 -->
    <g transform="translate(436, 226)">
      <rect width="206" height="54" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="10" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#101D35">Bus #01 • Route 1A</text>
      <text x="10" y="34" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Driver: Suresh P. • Arrived</text>
      <rect x="148" y="10" width="48" height="16" rx="8" fill="#EFF5FF"/>
      <text x="154" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#1264E8">ARRIVED</text>
    </g>
  </g>
</svg>
