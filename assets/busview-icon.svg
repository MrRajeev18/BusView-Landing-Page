<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- Outer Location Pin in Primary Blue #1264E8 -->
  <path d="M24 2C15.163 2 8 9.163 8 18C8 28.5 22.1 44.6 22.7 45.3C23.4 46.1 24.6 46.1 25.3 45.3C25.9 44.6 40 28.5 40 18C40 9.163 32.837 2 24 2Z" fill="#1264E8"/>
  
  <!-- Subtle inner gradient / bevel for depth -->
  <path d="M24 3C15.716 3 9 9.716 9 18C9 27.8 22.4 43.1 23.4 44.2C23.7 44.6 24.3 44.6 24.6 44.2C25.6 43.1 39 27.8 39 18C39 9.716 32.284 3 24 3Z" fill="url(#pinGradient)" opacity="0.15"/>
  
  <!-- Inner White Circular Area -->
  <circle cx="24" cy="18" r="11" fill="#FFFFFF"/>
  
  <!-- Dark Navy School Bus Symbol #101D35 -->
  <g fill="#101D35">
    <!-- Bus main body -->
    <rect x="16.5" y="11.5" width="15" height="10" rx="1.5"/>
    <!-- Roof curve accent -->
    <path d="M17.5 11.5H30.5C31.05 11.5 31.5 11.95 31.5 12.5V13H16.5V12.5C16.5 11.95 16.95 11.5 17.5 11.5Z" fill="#101D35"/>
    <!-- Windshield / Windows cutouts in white -->
    <rect x="18" y="13" width="5.5" height="3" rx="0.5" fill="#FFFFFF"/>
    <rect x="24.5" y="13" width="5.5" height="3" rx="0.5" fill="#FFFFFF"/>
    <!-- Grill lines -->
    <rect x="18.5" y="17.2" width="11" height="0.8" rx="0.4" fill="#FFFFFF"/>
    <rect x="19.5" y="18.6" width="9" height="0.6" rx="0.3" fill="#FFFFFF"/>
    <!-- Headlights -->
    <circle cx="17.7" cy="19" r="0.7" fill="#12CBA5"/>
    <circle cx="30.3" cy="19" r="0.7" fill="#12CBA5"/>
    <!-- Left Wheel -->
    <circle cx="18.5" cy="22" r="1.6" fill="#101D35"/>
    <circle cx="18.5" cy="22" r="0.7" fill="#FFFFFF"/>
    <!-- Right Wheel -->
    <circle cx="29.5" cy="22" r="1.6" fill="#101D35"/>
    <circle cx="29.5" cy="22" r="0.7" fill="#FFFFFF"/>
  </g>
  
  <defs>
    <linearGradient id="pinGradient" x1="24" y1="2" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
</svg>
