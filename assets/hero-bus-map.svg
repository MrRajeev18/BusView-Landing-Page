<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none" width="540" height="380">
  <defs>
    <filter id="cardShadow" x="-10" y="-5" width="560" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#101D35" flood-opacity="0.08" />
    </filter>
    <linearGradient id="mapBgGrad" x1="0" y1="0" x2="540" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="routeGrad" x1="60" y1="180" x2="480" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1264E8" />
      <stop offset="100%" stop-color="#12CBA5" />
    </linearGradient>
  </defs>

  <!-- Map Base Background -->
  <rect width="540" height="380" rx="14" fill="url(#mapBgGrad)"/>

  <!-- City Grid Roads / Land Geometry -->
  <!-- Park zones -->
  <path d="M 40 40 Q 90 20 160 50 L 140 120 Q 80 110 40 80 Z" fill="#DCFCE7" opacity="0.8"/>
  <path d="M 380 240 Q 440 220 500 250 L 490 340 Q 420 350 370 310 Z" fill="#DCFCE7" opacity="0.8"/>
  <text x="75" y="75" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#15803D" opacity="0.8">Oakwood Park</text>

  <!-- Minor Residential Streets -->
  <path d="M 0 110 L 540 110" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
  <path d="M 0 250 L 540 250" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
  <path d="M 120 0 L 120 380" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
  <path d="M 280 0 L 280 380" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>
  <path d="M 420 0 L 420 380" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round"/>

  <!-- Secondary Diagonal Roads -->
  <path d="M 30 360 L 250 20" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>
  <path d="M 300 370 L 520 80" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round"/>

  <!-- Main School Bus Arterial Avenue (Wide Blue-Gray) -->
  <path d="M 40 200 C 120 180, 160 140, 240 150 C 320 160, 360 210, 480 180" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M 40 200 C 120 180, 160 140, 240 150 C 320 160, 360 210, 480 180" stroke="#CBD5E1" stroke-width="14" stroke-linecap="round"/>

  <!-- Active Bus Route Polyline (Glowing Primary Blue / Teal) -->
  <path d="M 40 200 C 120 180, 160 140, 240 150 C 320 160, 360 210, 480 180" stroke="url(#routeGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Bus Route Stops -->
  <!-- Stop 1 (Completed) -->
  <circle cx="70" cy="193" r="7" fill="#1264E8" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="70" cy="193" r="2.5" fill="#FFFFFF"/>
  <text x="45" y="222" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#475569">Stop 1: Hill View</text>

  <!-- Stop 2 (Completed) -->
  <circle cx="185" cy="144" r="7" fill="#1264E8" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="185" cy="144" r="2.5" fill="#FFFFFF"/>
  <text x="155" y="128" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#475569">Stop 2: St. Jude</text>

  <!-- Stop 3 (Target / Next Stop) -->
  <circle cx="310" cy="162" r="9" fill="#12CBA5" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="310" cy="162" r="3.5" fill="#FFFFFF"/>
  <text x="270" y="142" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0E705A">Stop 3: Maple Oak (Next)</text>

  <!-- Destination: Heritage High School -->
  <g transform="translate(450, 150)">
    <circle cx="20" cy="20" r="18" fill="#101D35" stroke="#FFFFFF" stroke-width="3" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <!-- School Building icon inside -->
    <path d="M 12 24 L 20 13 L 28 24 Z" fill="#F59E0B"/>
    <rect x="14" y="22" width="12" height="7" fill="#FFFFFF"/>
    <rect x="18" y="25" width="4" height="4" fill="#101D35"/>
    <text x="-15" y="44" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" fill="#101D35">School Campus</text>
  </g>

  <!-- Pulsing Radar on Current Bus Location -->
  <circle cx="255" cy="154" r="22" fill="#1264E8" opacity="0.2"/>
  <circle cx="255" cy="154" r="14" fill="#1264E8" opacity="0.35"/>

  <!-- Real Yellow School Bus Marker on Route -->
  <g transform="translate(235, 134)" filter="drop-shadow(0 6px 10px rgba(0,0,0,0.22))">
    <!-- Bus Roof & Body -->
    <rect x="0" y="4" width="44" height="24" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <!-- Front Hood Bump -->
    <path d="M 38 7 L 45 10 L 45 22 L 38 25 Z" fill="#D97706"/>
    <!-- Windows -->
    <rect x="5" y="7" width="6" height="7" rx="1" fill="#101D35"/>
    <rect x="13" y="7" width="6" height="7" rx="1" fill="#101D35"/>
    <rect x="21" y="7" width="6" height="7" rx="1" fill="#101D35"/>
    <rect x="29" y="7" width="6" height="7" rx="1" fill="#101D35"/>
    <rect x="37" y="7" width="6" height="7" rx="1" fill="#101D35"/>
    <!-- Black Side Striping -->
    <line x1="2" y1="18" x2="42" y2="18" stroke="#101D35" stroke-width="2"/>
    <!-- Wheels -->
    <circle cx="10" cy="28" r="4.5" fill="#101D35" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="34" cy="28" r="4.5" fill="#101D35" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Bus Number Badge -->
    <rect x="12" y="0" width="20" height="10" rx="3" fill="#101D35"/>
    <text x="15" y="8" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" fill="#FFFFFF">BUS 04</text>
  </g>

  <!-- Live Telemetry Tag -->
  <g transform="translate(20, 20)">
    <rect width="180" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" filter="drop-shadow(0 4px 6px rgba(16,29,53,0.06))"/>
    <circle cx="16" cy="21" r="5" fill="#12CBA5"/>
    <text x="28" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#101D35">BUS #04 (MORNING RUN)</text>
    <text x="28" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B">Live GPS • Speed: 32 km/h</text>
  </g>
</svg>
